server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Angular SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build output: the name changes whenever the content does
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|avif)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else keeps its name across releases, so it must be revalidated
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Don't cache runtime config (injected via ConfigMap)
    location = /assets/config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
